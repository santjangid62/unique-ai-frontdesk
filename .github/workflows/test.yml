name: tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The mock suites never start an in-memory MongoDB; skip its 500 MB download.
      MONGOMS_DISABLE_POSTINSTALL: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Fails the build when package.json and a lockfile drift apart, before
      # wasting time on an install that would rewrite them silently.
      - name: Check lockfiles are in sync
        run: npm run lock:check
      - run: npm ci
      - run: npm test
