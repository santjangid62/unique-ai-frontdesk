name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The mock suites never start an in-memory MongoDB; skip its 500 MB postinstall.
      # The smoke job downloads the binary it actually needs and caches it below.
      MONGOMS_DISABLE_POSTINSTALL: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The setup guide's demo-login table must equal what the seed scripts create.
      # Needs no install, so a changed password fails the push before anything else.
      - name: Demo credentials match the setup guide
        run: npm run test:credentials
      # The committed PDF must be rebuilt from the current HTML, so a stale guide
      # cannot ship. Also needs no install.
      - name: Setup guide PDF matches the HTML
        run: npm run test:docs-pdf
      # Fails the build when package.json and a lockfile drift apart, before
      # wasting time on an install that would rewrite them silently.
      - name: Check lockfiles are in sync
        run: npm run lock:check
      - run: npm ci
      # The client is a separate package (its own lockfile), so it needs its own install.
      - name: Install client dependencies
        run: npm --prefix client ci
      - name: Cache the mongod binary used by the smoke test
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # A broken import or JSX error should fail here, not on Vercel's build.
      - name: Build client
        run: npm run build
      # Boots an in-memory MongoDB, seeds it and runs the API smoke suite, so
      # auth, RBAC and tenant-isolation regressions are caught on every push.
      - name: Smoke test against an in-memory database
        run: npm run smoke:ci
      # Atlas mock, deploy mock and the guide/seed credential check.
      - name: Unit tests (Atlas mock, deploy mock, demo credentials)
        run: npm test
