name: tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The mock suites never start an in-memory MongoDB; skip its 500 MB download.
      MONGOMS_DISABLE_POSTINSTALL: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
